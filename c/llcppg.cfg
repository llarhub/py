{
	"Name": "py",
	"LLGoPackage": "link: $LLGO_LIB_PYTHON; $(pkg-config --libs python3-embed)",
	"Stdlib": "",
	"Dir": "./include/...",
	"Files": ["Python.h"],
	"Deps": [],
	"Class": [],
	"NonClass": ["Import"],
	"TypePrefix": ["Py_", "Py"],
	"FuncPrefix": ["Py_", "Py"],
	"MethodCheck": ["Py*_: $1"],
	"MacroPrefix": ["PY_", "Py_"],
	"EnumPrefix": ["PY_"],
	"VarPrefix": ["PY_", "Py_", "Py"],
	"TypeAbbr": {
	},
	"Rename": {
		"PyErr_SetFromErrnoWithFilenameObject": "ErrSetFromErrnoWithFilenameObject",
		"PyImport_Import": "Import"
	},
	"MacroIgnore": [],
	"TypeIgnore": [],
	"GroupSubdirBy": "fname",
	"FailFast": 10,
	"ForceCamelCase": true,
	"IgnoreInline": true,
	"Language": "c"
}
