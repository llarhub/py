{
	"Name": "py",
	"LLGoPackage": "link: $LLGO_LIB_PYTHON; $(pkg-config --libs python3-embed)",
	"Stdlib": "",
	"Dir": "./include/...",
	"Files": ["Python.h"],
	"GoFiles": ["llcppg.go"],
	"Deps": [],
	"Class": [],
	"NonClass": ["ObjectArenaAllocator"],
	"TypePrefix": ["Py_", "Py"],
	"FuncPrefix": ["PyImport_", "Py_", "Py"],
	"NewCheck": [
		"Py*_FromObject: $1Object .As$1",
		"Py*_From*: $1Object $1From$2",
		"Py*_New: $1Object $1New",
		"Py*_NewObject: $1Object $1_NewObject",
		"PyImport_ImportModuleAttr*: Object ImportModuleAttr$1",
		"PyImport_Import*: ModuleObject Import$1",
		"PyImport_AddModule*: ModuleObject AddModule$1",
		"PyImport_GetModule: ModuleObject GetModule",
		"PyDict_Keys: ListObject (*DictObject).Keys",
		"PyDict_Values: ListObject (*DictObject).Values",
		"PyObject_Type: TypeObject .Type",
		"PyModule_GetDict: DictObject (*ModuleObject).Dict",
		"PyModule_GetDef: ModuleDef .GetDef"
	],
	"MethodCheck": [
		"Py_: ",
		"PyThread_tss_: TssT",
		"PyImport_ImportFrozenModuleObject: ",
		"PyCallable_Check: Object",
		"Py*_: $1Object, $1"
	],
	"MacroPrefix": ["PY_", "PYTHON_", "Py_", "Py"],
	"EnumPrefix": ["PY_", "Py_", "Py"],
	"VarPrefix": ["PY_", "Py_", "Py"],
	"TypeAbbr": [
		"TssT: ThreadTss",
		"*Object: $1"
	],
	"TypeDef": {
		"moduleobject.go": [{
			"Name": "ModuleObject",
			"Fields": [".Object"]
		}]
	},
	"Rename": {
		"PyObject_CallObject": "CallObject",
		"PyCallable_Check": "Callable",
		"PyErr_SetFromErrnoWithFilenameObject": "ErrSetFromErrnoWithFilenameObject",
		"PyEval_EvalCode": "EvalCode",
		"PyEval_EvalCodeEx": "EvalCodeEx",
		"PyEval_EvalFrame": "EvalFrame",
		"PyEval_EvalFrameEx": "EvalFrameEx",
		"_PyEval_EvalFrameDefault": "X_EvalFrameDefault",
		"PyLong_FreeExport": "Free",
		"PyLong_AsLongLong": "AsLongLong",
		"PyLong_AsLong": "AsLong",
		"PyThreadState_Next": "GetNext"
	},
	"MacroIgnore": [
		"Py_PACK_VERSION",
		"Py_CompileString",
		"Py_CompileStringFlags",
		"PyRun_String",
		"PyRun_AnyFile",
		"PyRun_AnyFileEx",
		"PyRun_AnyFileFlags",
		"PyRun_SimpleString",
		"PyRun_SimpleFile",
		"PyRun_SimpleFileEx",
		"PyRun_InteractiveOne",
		"PyRun_InteractiveLoop",
		"PyRun_File",
		"PyRun_FileEx",
		"PyRun_FileFlags"
	],
	"TypeIgnore": [],
	"GroupSubdirBy": "fname",
	"FailFast": 10,
	"ForceCamelCase": true,
	"IgnoreInline": true,
	"Language": "c"
}
